apiVersion: v1
kind: Secret
metadata:
  name: middle-school-math-api-secrets
  labels:
    app.kubernetes.io/name: middle-school-math-api
type: Opaque
stringData:
  SNOWFLAKE_ACCOUNT: "replace-with-account-identifier"
  SNOWFLAKE_USER: "replace-with-service-user"
  SNOWFLAKE_PASSWORD: "replace-with-password"
  OPENAI_API_KEY: "replace-with-openai-api-key"
