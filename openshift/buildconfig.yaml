apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: middle-school-math-api
  labels:
    app.kubernetes.io/name: middle-school-math-api
spec:
  runPolicy: Serial

  source:
    type: Binary
    binary: {}

  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile

  output:
    to:
      kind: ImageStreamTag
      name: middle-school-math-api:latest

  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
      ephemeral-storage: "2Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
      ephemeral-storage: "10Gi"

  completionDeadlineSeconds: 7200

  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3